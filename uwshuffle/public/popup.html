<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UW Shuffle</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup-container">
      <!-- Header with Logo -->
      <div class="popup-header">
        <img
          src="logo.svg"
          alt="UW Shuffle"
          class="popup-logo"
          id="popup-logo"
        />
        <div class="popup-title">
          <h1>UW Shuffle</h1>
          <p>Making Quest easier to use</p>
        </div>
      </div>

      <!-- Website Link -->
      <div class="popup-section">
        <h3 class="section-label">Quick Links</h3>
        <a
          href="https://uwshuffle.com"
          target="_blank"
          class="popup-link website-link"
        >
          <img src="logo.svg" alt="UW Shuffle" class="link-icon" />
          Visit UW Shuffle
        </a>

        <a
          href="https://uwflow.com"
          target="_blank"
          class="popup-link uwflow-link"
        >
          <img src="uwflow.png" alt="UW Flow" class="link-icon" />
          UW Flow
        </a>
      </div>

      <!-- Credits -->
      <div class="popup-credits">
        <div class="credits-header">
          <h3>
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M20 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M4 21v-2a4 4 0 0 1 3-3.87"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            Created by Jacob Fu
          </h3>
        </div>
        <div class="credits-content">
          <a
            href="https://www.linkedin.com/in/fujacob/"
            target="_blank"
            class="popup-link linkedin-link"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"
              ></path>
              <rect x="2" y="9" width="4" height="12"></rect>
              <circle cx="4" cy="4" r="2"></circle>
            </svg>
            @fujacob
          </a>
          <a
            href="https://x.com/fujacob"
            target="_blank"
            class="popup-link x-link"
          >
            <span style="font-size: 16px; font-weight: bold">𝕏</span>
            @fujacobb
          </a>
          <a
            href="https://github.com/fujacob"
            target="_blank"
            class="popup-link github-link"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"
              ></path>
            </svg>
            @fujacob
          </a>
          <a
            href="mailto:fujacob@uwaterloo.ca"
            class="popup-link linkedin-link"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
              ></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            Email me
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
